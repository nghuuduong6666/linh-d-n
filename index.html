<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Linh Dân! 🎆</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at bottom, #1f2b3e 0%, #090a0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            position: relative;
        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .floating-emoji {
            position: fixed;
            top: -50px;
            font-size: 24px;
            z-index: 1;
            pointer-events: none;
            animation: fall linear forwards;
            opacity: 0.85;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 26px;
            padding: 36px 28px;
            text-align: center;
            max-width: 460px;
            width: 92%;
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.55);
            animation: float 3.5s ease-in-out infinite;
            position: relative;
            z-index: 2;
            color: #ffffff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-9px); }
        }

        .cake-wrap {
            position: relative;
            display: inline-block;
            cursor: pointer;
            user-select: none;
            margin-bottom: 8px;
        }

        .flame {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            animation: flicker 0.25s infinite alternate;
            transition: opacity 0.3s, transform 0.3s;
        }

        .flame.blown {
            opacity: 0;
            transform: translateX(-50%) scale(0.2);
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-4deg); }
            100% { transform: translateX(-50%) scale(1.12) rotate(4deg); }
        }

        .cake {
            font-size: 64px;
            display: inline-block;
            animation: bounce 1.6s infinite;
            filter: drop-shadow(0 0 16px rgba(255, 190, 210, 0.65));
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .cake-hint {
            font-size: 0.78rem;
            color: #ffeaa7;
            opacity: 0.85;
            margin-bottom: 6px;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff6b81;
            font-size: 2.4rem;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 107, 129, 0.5);
        }

        .name {
            color: #ffeaa7;
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        p {
            color: #f1f2f6;
            font-size: 1.06rem;
            line-height: 1.65;
            margin-bottom: 16px;
        }

        .wish-box {
            background: rgba(255, 234, 167, 0.14);
            border: 1px dashed rgba(255, 234, 167, 0.5);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.95rem;
            color: #ffeaa7;
            margin-bottom: 24px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 11px 18px;
            font-size: 0.92rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 71, 87, 0.42);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        button.secondary {
            background: linear-gradient(45deg, #ffa502, #ff7f50);
            box-shadow: 0 6px 18px rgba(255, 165, 2, 0.38);
        }

        button.music-btn {
            background: linear-gradient(45deg, #2ed573, #1e90ff);
            box-shadow: 0 6px 18px rgba(30, 144, 255, 0.38);
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="card">
        <div class="cake-wrap" onclick="blowCandle()" title="Bấm để thổi nến">
            <div class="flame" id="flame">🕯️</div>
            <div class="cake">🎂</div>
        </div>
        <div class="cake-hint" id="cakeHint">👆 Bấm vào bánh để thổi nến &amp; nhận điều ước</div>

        <h1>Happy Birthday!</h1>
        <div class="name"> Linh Dân </div>

        <p>
            Mừng Thọ 18 Tỏi<br>
            Chúc Tuổi Mới Tiền Đầy Nhà Gà Đầy Chuồng 
        </p>

        <div class="wish-box" id="wishBox">
            Nhấn "Bắn pháo hoa" hoặc thổi nến để mở điều ước tuổi mới nhé! 🎁
        </div>

        <div class="btn-group">
            <button onclick="launchBigShow()">Bắn pháo hoa 🎆</button>
            <button class="secondary" onclick="fireConfetti()">Tung pháo giấy 🎉</button>
            <button class="music-btn" id="musicBtn" onclick="toggleMusic()">Bật nhạc 🎵</button>
        </div>
    </div>

    <script>
        // --- 1. PHÁO GIẤY ---
        function fireConfetti() {
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // --- 2. MƯA ICON LỘC LÁ ---
        const icons = ['💰', '🐔', '🧧', '✨', '🎉', '💖'];
        function spawnEmoji() {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.textContent = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (4 + Math.random() * 4) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 8000);
        }
        setInterval(spawnEmoji, 900);

        // --- 3. THỔI NẾN & ĐIỀU ƯỚC ---
        const wishes = [
            "18 tỏi vào tài khoản, tiền đếm mỏi tay, gà đẻ đều như vắt chanh! 💰🐔",
            "Tuổi mới ăn ngon ngủ kỹ, đi đâu cũng gặp may, việc gì cũng thuận lợi! 🌟",
            "Chúc Linh Dân rực rỡ như pháo hoa, cười nhiều như trúng số độc đắc! 🎆🍀",
            "Sức khỏe dồi dào, ví tiền rủng rỉnh, niềm vui nhân đôi mỗi ngày! 💖🥳"
        ];
        let candleBlown = false;

        function blowCandle() {
            const flame = document.getElementById('flame');
            const hint = document.getElementById('cakeHint');
            const wishBox = document.getElementById('wishBox');

            if (!candleBlown) {
                flame.classList.add('blown');
                candleBlown = true;
                hint.textContent = "✨ Nến đã tắt! Bấm lần nữa để thắp lại nhé";
                launchBigShow();
            } else {
                flame.classList.remove('blown');
                candleBlown = false;
                hint.textContent = "👆 Bấm vào bánh để thổi nến & nhận điều ước";
            }

            const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
            wishBox.textContent = randomWish;
        }

        // --- 4. NHẠC NỀN HAPPY BIRTHDAY (WEB AUDIO API) ---
        let audioCtx = null;
        let isPlaying = false;
        let musicTimer = null;

        // Tần số (Hz) và độ dài nốt của giai điệu Happy Birthday
        const melody = [
            [261.63, 0.35], [261.63, 0.25], [293.66, 0.6], [261.63, 0.6], [349.23, 0.6], [329.63, 1.0],
            [261.63, 0.35], [261.63, 0.25], [293.66, 0.6], [261.63, 0.6], [392.00, 0.6], [349.23, 1.0],
            [261.63, 0.35], [261.63, 0.25], [523.25, 0.6], [440.00, 0.6], [349.23, 0.6], [329.63, 0.6], [293.66, 1.0],
            [466.16, 0.35], [466.16, 0.25], [440.00, 0.6], [349.23, 0.6], [392.00, 0.6], [349.23, 1.2]
        ];

        function playMelodyLoop() {
            if (!isPlaying || !audioCtx) return;
            let currentTime = audioCtx.currentTime;
            let totalDuration = 0;

            melody.forEach(([freq, dur]) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, currentTime);

                gain.gain.setValueAtTime(0.001, currentTime);
                gain.gain.exponentialRampToValueAtTime(0.12, currentTime + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, currentTime + dur - 0.02);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(currentTime);
                osc.stop(currentTime + dur);

                currentTime += dur;
                totalDuration += dur;
            });

            musicTimer = setTimeout(playMelodyLoop, totalDuration * 1000 + 400);
        }

        function toggleMusic() {
            const btn = document.getElementById('musicBtn');
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!isPlaying) {
                isPlaying = true;
                btn.textContent = "Tắt nhạc 🔇";
                playMelodyLoop();
            } else {
                isPlaying = false;
                clearTimeout(musicTimer);
                btn.textContent = "Bật nhạc 🎵";
            }
        }

        // --- 5. PHÁO HOA BẦU TRỜI ĐÊM ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let rockets = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81', '#ffeaa7', '#a29bfe'];

        class Rocket {
            constructor(targetX, targetY) {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetX = targetX ?? (Math.random() * canvas.width * 0.8 + canvas.width * 0.1);
                this.targetY = targetY ?? (Math.random() * canvas.height * 0.45 + canvas.height * 0.08);
                const angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
                const speed = 7 + Math.random() * 3;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 15 || this.vy >= 0) {
                    explode(this.x, this.y, this.color);
                    return false;
                }
                return true;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.018 + 0.012;
                this.gravity = 0.06;
                this.color = color;
            }

            update() {
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function explode(x, y, color) {
            const count = 65;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function launchBigShow() {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    rockets.push(new Rocket());
                }, i * 220);
            }
            fireConfetti();
        }

        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && !e.target.closest('.cake-wrap')) {
                rockets.push(new Rocket(e.clientX, e.clientY));
            }
        });

        setInterval(() => {
            if (rockets.length < 4) {
                rockets.push(new Rocket());
            }
        }, 1400);

        function animate() {
            ctx.fillStyle = 'rgba(9, 10, 15, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            rockets = rockets.filter(r => {
                const alive = r.update();
                r.draw();
                return alive;
            });

            particles = particles.filter(p => {
                const alive = p.update();
                p.draw();
                return alive;
            });

            requestAnimationFrame(animate);
        }

        window.onload = () => {
            animate();
            setTimeout(launchBigShow, 400);
        };
    </script>

</body>
</html>
