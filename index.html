# <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật! 🎆</title>
    <!-- Thư viện pháo giấy -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Pacifico&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at bottom, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Canvas pháo hoa nằm phía sau thiệp */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: float 3.5s ease-in-out infinite;
            position: relative;
            z-index: 2;
            color: #ffffff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .cake {
            font-size: 64px;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 1.5s infinite;
            filter: drop-shadow(0 0 15px rgba(255, 180, 200, 0.6));
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff6b81;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 107, 129, 0.5);
        }

        .name {
            color: #ffeaa7;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        p {
            color: #f1f2f6;
            font-size: 1.08rem;
            line-height: 1.65;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 12px 22px;
            font-size: 0.98rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.45);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        button.secondary {
            background: linear-gradient(45deg, #ffa502, #ff7f50);
            box-shadow: 0 6px 20px rgba(255, 165, 2, 0.4);
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="card">
        <div class="cake">🎂</div>
        <h1>Happy Birthday!</h1>
        <!-- SỬA TÊN NGƯỜI NHẬN Ở ĐÂY -->
        <div class="name">Linh Dân</div>
        
        <!-- SỬA LỜI CHÚC Ở ĐÂY -->
        <p>
                      Mừng Thọ 18 Tỏi
          Chúc Tuổi Mới Tiền Đầy Nhà Gà Đầy Chuồng
        </p>

        <div class="btn-group">
            <button onclick="launchBigShow()">Bắn pháo hoa 🎆</button>
            <button class="secondary" onclick="fireConfetti()">Tung pháo giấy 🎉</button>
        </div>
    </div>

    <script>
        // --- 1. HIỆU ỨNG PHÁO GIẤY ---
        function fireConfetti() {
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // --- 2. HIỆU ỨNG PHÁO HOA BẦU TRỜI ĐÊM ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let rockets = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81', '#ffeaa7', '#a29bfe'];

        class Rocket {
            constructor(targetX, targetY) {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetX = targetX ?? (Math.random() * canvas.width * 0.8 + canvas.width * 0.1);
                this.targetY = targetY ?? (Math.random() * canvas.height * 0.45 + canvas.height * 0.08);
                const angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
                const speed = 7 + Math.random() * 3;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                // Khi tới gần điểm nổ
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 15 || this.vy >= 0) {
                    explode(this.x, this.y, this.color);
                    return false;
                }
                return true;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.018 + 0.012;
                this.gravity = 0.06;
                this.color = color;
            }

            update() {
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function explode(x, y, color) {
            const count = 65;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Bắn liên hoàn khi bấm nút hoặc mở trang
        function launchBigShow() {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    rockets.push(new Rocket());
                }, i * 220);
            }
            fireConfetti();
        }

        // Cho phép bấm thẳng vào vùng trống trên màn hình để bắn pháo hoa tại vị trí đó
        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                rockets.push(new Rocket(e.clientX, e.clientY));
            }
        });

        // Pháo hoa bắn lai rai tự động
        setInterval(() => {
            if (rockets.length < 4) {
                rockets.push(new Rocket());
            }
        }, 1400);

        function animate() {
            // Tạo vệt mờ nhẹ để pháo hoa có đuôi sáng
            ctx.fillStyle = 'rgba(9, 10, 15, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            rockets = rockets.filter(r => {
                const alive = r.update();
                r.draw();
                return alive;
            });

            particles = particles.filter(p => {
                const alive = p.update();
                p.draw();
                return alive;
            });

            requestAnimationFrame(animate);
        }

        window.onload = () => {
            animate();
            setTimeout(launchBigShow, 400);
        };
    </script>

</body>
</html>linh-d-n
